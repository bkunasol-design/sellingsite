<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASTROPHAGE ROASTERY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Source+Sans+3:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Syncopate:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">ASTROPHAGE</a>
    <nav>
      <a href="coffee.html" aria-current="page">Coffee</a>
      <a href="quiz.html">Find Yours</a>
      <a href="about.html">About Us</a>
    </nav>
  </header>

  <main>
    <section class="hero banner"><h1>Our Selections</h1></section>
    <div class="cats">
      <section class="cat-single"><h2>Single Origins</h2><div class="tiles" id="single"></div></section>
      <section class="cat-blend"><h2>Blends</h2><div class="tiles" id="blend"></div></section>
      <section class="cat-reserve"><h2>Reserves</h2><div class="tiles" id="reserve"></div></section>
    </div>
  </main>
  <script src="coffeesV1.js"></script>
  <script>
    ["single", "blend", "reserve"].forEach(function (type) {
      document.getElementById(type).innerHTML = coffees.filter(c => c.t === type).map(c => card(c)).join("");
    });
  </script>
</body>
</html>
